    function TelemetryHeader() {
      return (
        <header className="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-6 py-3.5 flex items-center justify-between sticky top-0 z-20 shadow-md">
          <h1 className="text-base md:text-lg font-bold tracking-tight text-white font-sans bg-gradient-to-r from-white via-slate-100 to-slate-300 bg-clip-text text-transparent">

    function ChaosPanel({ controls, onChange, onResetChat, onResetDemo, isResettingDemo, onOpenSettings, onSelectStage, onOpenArchitectureModal, messages = [], lastMetadata = null }) {
      // Collapsible panels state (default closed, 5s inactivity auto-close)
      const [isOverrideOpen, setIsOverrideOpen] = useState(false);
      const [isStagesOpen, setIsStagesOpen] = useState(false);

      const overrideTimerRef = useRef(null);
      const stagesTimerRef = useRef(null);

      const resetOverrideTimer = () => {
        if (overrideTimerRef.current) clearTimeout(overrideTimerRef.current);
        overrideTimerRef.current = setTimeout(() => {
          setIsOverrideOpen(false);
        }, 5000);
      };

      const resetStagesTimer = () => {
        if (stagesTimerRef.current) clearTimeout(stagesTimerRef.current);
        stagesTimerRef.current = setTimeout(() => {
          setIsStagesOpen(false);
        }, 5000);
      };

      const handleToggleOverride = () => {
        setIsOverrideOpen((prev) => {
          const next = !prev;
          if (next) resetOverrideTimer();
          else if (overrideTimerRef.current) clearTimeout(overrideTimerRef.current);
          return next;
        });
      };

      const handleToggleStages = () => {
        setIsStagesOpen((prev) => {
          const next = !prev;
          if (next) resetStagesTimer();
          else if (stagesTimerRef.current) clearTimeout(stagesTimerRef.current);
          return next;
        });
      };

      useEffect(() => {
        return () => {
          if (overrideTimerRef.current) clearTimeout(overrideTimerRef.current);
          if (stagesTimerRef.current) clearTimeout(stagesTimerRef.current);
        };
      }, []);

      const currentStage =
        controls.stage !== undefined
          ? controls.stage
          : controls.enablePiiTokenizer && controls.enterpriseDataEnabled && controls.tokenomicsEnabled
          ? 4
          : controls.enablePiiTokenizer && controls.enterpriseDataEnabled && !controls.tokenomicsEnabled
          ? 3
          : controls.enablePiiTokenizer && !controls.enterpriseDataEnabled && !controls.tokenomicsEnabled
          ? 2
          : !controls.enablePiiTokenizer && !controls.enterpriseDataEnabled && !controls.tokenomicsEnabled && (controls.stageZeroRuntimeEnabled === false || controls.stageZeroIntelligenceEnabled === false)
          ? 0
          : 1;

      const [isEyeStrobing, setIsEyeStrobing] = useState(false);
      const prevRuntimeRef = useRef(controls.stageZeroRuntimeEnabled);

      useEffect(() => {
        if (!prevRuntimeRef.current && controls.stageZeroRuntimeEnabled) {
          setIsEyeStrobing(true);
          const timer = setTimeout(() => setIsEyeStrobing(false), 900);
          return () => clearTimeout(timer);
        }
        prevRuntimeRef.current = controls.stageZeroRuntimeEnabled;
      }, [controls.stageZeroRuntimeEnabled]);

      const isRuntimeOn = currentStage >= 1 || (controls.stageZeroRuntimeEnabled ?? false);
      const isIntelligenceOn = currentStage >= 1 || (controls.stageZeroIntelligenceEnabled ?? false);

      const handleStageSelect = (stage) => {
        if (onSelectStage) {
          onSelectStage(stage);
        } else {
          if (stage === 0) {
            onChange({ ...controls, stage: 0, enablePiiTokenizer: false, enterpriseDataEnabled: false, tokenomicsEnabled: false, stageZeroRuntimeEnabled: false, stageZeroIntelligenceEnabled: false, forcedTier: 'AUTO', failedTiers: [] });
          } else if (stage === 1) {
            onChange({ ...controls, stage: 1, enablePiiTokenizer: false, enterpriseDataEnabled: false, tokenomicsEnabled: false, stageZeroRuntimeEnabled: true, stageZeroIntelligenceEnabled: true, forcedTier: 'AUTO', failedTiers: [] });
          } else if (stage === 2) {
            onChange({ ...controls, stage: 2, enablePiiTokenizer: true, enterpriseDataEnabled: false, tokenomicsEnabled: false, stageZeroRuntimeEnabled: true, stageZeroIntelligenceEnabled: true, forcedTier: 'AUTO', failedTiers: [] });
          } else if (stage === 3) {
            onChange({ ...controls, stage: 3, enablePiiTokenizer: true, enterpriseDataEnabled: true, tokenomicsEnabled: false, stageZeroRuntimeEnabled: true, stageZeroIntelligenceEnabled: true, forcedTier: 'AUTO', failedTiers: [] });
          } else if (stage === 4) {
            onChange({ ...controls, stage: 4, enablePiiTokenizer: true, enterpriseDataEnabled: true, tokenomicsEnabled: true, stageZeroRuntimeEnabled: true, stageZeroIntelligenceEnabled: true, forcedTier: 'AUTO', failedTiers: [] });
          }
          if (onResetChat) onResetChat();
        }
      };

      const handleForcedTierChange = (tier) => {
        onChange({
          ...controls,
          forcedTier: tier,
          failedTiers: tier === 'AUTO' ? controls.failedTiers : [],
        });
      };

      const handleToggleFailTier = (tierId) => {
        if (controls.forcedTier !== 'AUTO') return;
        const currentFailed = controls.failedTiers || [];
        const isFailed = currentFailed.includes(tierId);
        const updatedFailed = isFailed
          ? currentFailed.filter((id) => id !== tierId)
          : [...currentFailed, tierId];
        onChange({ ...controls, failedTiers: updatedFailed });
      };

      const getEffectiveActiveTier = () => {
        const failed = controls.failedTiers || [];
        const tierOrder = ['TIER_1_GLOBAL', 'TIER_2_REGIONAL', 'TIER_3_SOVEREIGN'];
        const startIndex =
          controls.forcedTier !== 'AUTO'
            ? tierOrder.indexOf(controls.forcedTier)
            : 0;

        for (let i = Math.max(0, startIndex); i < tierOrder.length; i++) {
          if (!failed.includes(tierOrder[i])) {
            return tierOrder[i];
          }
        }
        return 'TIER_3_SOVEREIGN';
      };

      const activeTier = getEffectiveActiveTier();

      const getAgentCharacter = () => {
        let piiCleanserText = 'Disabled (Bypassed)';
        let piiCleanserColor = 'text-slate-500 font-normal';
        if (controls.enablePiiTokenizer) {
          if (activeTier === 'TIER_3_SOVEREIGN') {
            piiCleanserText = 'Local Sidecar (On-Prem)';
            piiCleanserColor = 'text-emerald-400 font-semibold';
          } else if (activeTier === 'TIER_2_REGIONAL') {
            piiCleanserText = 'Cloud Run (AU-SYD Domestic)';
            piiCleanserColor = 'text-amber-400 font-semibold';
          } else {
            piiCleanserText = 'Cloud Run (AU-SYD Border)';
            piiCleanserColor = 'text-amber-400 font-semibold';
          }
        }

        let skillText = 'Standard Base Agent (No Domain Rules)';
        let skillColor = 'text-slate-500 font-normal';
        if (controls.enterpriseDataEnabled) {
          skillText = activeTier === 'TIER_3_SOVEREIGN'
            ? 'Baked Enclave: APRA Rulebook (Cord-Cut Ready ✓)'
            : 'Cloud Registry: APRA Underwriter (AU-SYD CMEK)';
          skillColor = activeTier === 'TIER_3_SOVEREIGN'
            ? 'text-purple-300 font-semibold'
            : 'text-amber-400 font-semibold';
        }

        let toolText = 'Disabled (Standard LLM Only)';
        let toolColor = 'text-slate-500 font-normal';
        if (controls.enterpriseDataEnabled) {
          toolText = activeTier === 'TIER_3_SOVEREIGN'
            ? 'calculate_customer_lvr (On-Prem)'
            : 'calculate_customer_lvr (Local VM Engine)';
          toolColor = 'text-emerald-400 font-semibold';
        }

        let storageRestText = activeTier === 'TIER_3_SOVEREIGN'
          ? 'Local Redis Replica (On-Prem)'
          : 'Vertex AI Managed Sessions (AU-SYD)';
        let storageRestColor = 'text-slate-400 font-normal';
        if (controls.enterpriseDataEnabled) {
          storageRestText = activeTier === 'TIER_3_SOVEREIGN'
            ? 'Local Disk Mirror (/src/data) (On-Prem)'
            : 'gs://au-fsi-customer-assets/ (AU-SYD CMEK)';
          storageRestColor = activeTier === 'TIER_3_SOVEREIGN'
            ? 'text-emerald-400 font-semibold'
            : 'text-amber-400 font-semibold';
        }

        const getModelDisplayName = (tier) => {
          const configuredModel = controls.tierSettings?.[tier]?.model;
          if (configuredModel) {
            if (configuredModel === 'gemini-3.7-flash') return 'Gemini 3.7 Flash';
            if (configuredModel === 'gemini-2.5-flash') return 'Gemini 2.5 Flash';
            if (configuredModel === 'gemini-1.5-pro-002') return 'Gemini 1.5 Pro (002)';
            if (configuredModel === 'gemini-1.5-flash-002') return 'Gemini 1.5 Flash (002)';
            if (configuredModel === 'gemini-2.0-flash-001') return 'Gemini 2.0 Flash (001)';
            if (configuredModel === 'gemini-2.0-pro-exp-02-05') return 'Gemini 2.0 Pro Experimental';
            if (configuredModel === 'gemini-1.0-pro-002') return 'Gemini 1.0 Pro (002)';
            if (configuredModel === 'gemini-1.5-flash-001') return 'Gemini 1.5 Flash (001)';
            if (configuredModel.includes('gemma')) return 'Gemma 2 (Self-Hosted)';
            return configuredModel;
          }
          if (tier === 'TIER_1_GLOBAL') return 'Gemini 3.7 Flash';
          if (tier === 'TIER_2_REGIONAL') return 'Gemini 2.5 Flash';
          return 'Gemma 2 (Self-Hosted)';
        };

        // Live cumulative and latest turn token calculation
        let inTokensCount = 0;
        let outTokensCount = 0;
        if (messages && messages.length > 0) {
          messages.forEach((m) => {

                  <div className={`flex items-center gap-2 ${intelligenceEnabled ? 'text-blue-300 font-semibold' : 'text-slate-500'}`}>
                    <span>{intelligenceEnabled ? '✔' : '○'}</span>

                  </div>
                  <div className={`flex items-center gap-2 ${intelligenceEnabled ? 'text-blue-300 font-semibold' : 'text-slate-500'}`}>
                    <span>{intelligenceEnabled ? '✔' : '○'}</span>

            {/* Fully Energized Banner & Advance Button */}

                  <button
                    type="button"
                    onClick={onAdvanceToStageOne}

                    <span>Advance to Stage 1: Resilience</span>

                {/* Optional Diagnostic Prompt Box */}
                <div className="pt-3 border-t border-slate-800/80">
                  <form onSubmit={handleTestPrompt} className="flex gap-2">
                    <input
                      type="text"
                      value={directPrompt}
                      onChange={(e) => setDirectPrompt(e.target.value)}
                      placeholder="Optional: Send raw diagnostic prompt to verify baseline LLM (e.g. 'Hello Agent')..."
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs font-mono text-white focus:outline-none focus:border-blue-500"
                    />
                    <button
                      type="submit"
                      disabled={isSendingPrompt || !directPrompt.trim()}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-200 text-xs font-mono font-semibold rounded-xl transition"
                    >
                      {isSendingPrompt ? 'Sending...' : 'Test Prompt'}
                    </button>
                  </form>
                  {promptOutput && (
                    <div className="mt-2.5 p-3 rounded-lg bg-slate-950 border border-slate-800 text-xs font-mono text-emerald-300">
                      <span className="text-slate-500 mr-2">&gt;</span>
                      {promptOutput}
                    </div>
                  )}
                </div>
              </div>
            ) : (
              <div className="p-4 rounded-xl bg-slate-900/60 border border-slate-800 text-center text-xs font-mono text-slate-400 flex items-center justify-center gap-2">
                <span>⚡</span>
                <span>Switch both circuit breakers above to complete Stage 0 assembly</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ChatWindow({ messages, isLoading, onSendMessage, enablePiiTokenizer = true, enterpriseDataEnabled = false, tokenomicsEnabled = false }) {
      const [input, setInput] = useState('');
      const [activeTab, setActiveTab] = useState('user');
      const [selectedLog, setSelectedLog] = useState(null);
      const [expandedLogs, setExpandedLogs] = useState({});
      const messagesEndRef = React.useRef(null);

      const effectiveTab = enablePiiTokenizer ? activeTab : 'user';

      // Determine active prompt chips set based on (enablePiiTokenizer, enterpriseDataEnabled)
      const activeChips = enterpriseDataEnabled
        ? LVR_CHIPS
        : enablePiiTokenizer
        ? PII_CHIPS
        : MEMORY_CHIPS;

      // Mode metadata for placeholder and clean description
      const modeMetadata = enterpriseDataEnabled
        ? {
            description: 'Demonstrates Enterprise LVR & APRA stress testing calculations with multi-tier memory.',
            placeholder: 'Ask about customer loans (e.g. Calculate LVR for Sarah Jenkins CUST-8821, or David Zhang APRA stress test)...',
          }
        : enablePiiTokenizer
        ? {
            description: 'Demonstrates Zero-PII Egress Tokenization and cleartext memory recall across tiers.',
            placeholder: "Type sensitive prompt (e.g. My mother's name is Alice, my father's name is Bob, TFN 123 456 782)...",
          }
        : {
            description: 'Demonstrates basic conversational memory across Tier 1 (Global), Tier 2 (AU-SYD), and Tier 3 (On-Prem).',
            placeholder: 'Ask a memory or general knowledge question (e.g. Give me the names of five cats / dogs)...',
          };

      // Find if latest user turn matches any starter chip to surface a dynamic follow-up memory recall chip
      const lastUserMsg = [...messages].reverse().find((m) => m.role === 'user');
      const matchedStarterChip = lastUserMsg
        ? activeChips.find(
            (chip) =>
              lastUserMsg.content.toLowerCase().includes(chip.prompt.toLowerCase().slice(0, 15)) ||
              chip.prompt.toLowerCase().includes(lastUserMsg.content.toLowerCase().slice(0, 15))
          )
        : null;

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, isLoading, effectiveTab]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!input.trim() || isLoading) return;
        onSendMessage(input);
        setInput('');
      };

      const toggleLog = (id) => {
        setExpandedLogs((prev) => ({ ...prev, [id]: !prev[id] }));
      };

      const highlightTokens = (text) => {
        if (!text) return null;
        const parts = text.split(/(\[\[PII_[A-Z0-9_]+\]\])/g);
        return parts.map((part, i) => {
          if (part.startsWith('[[PII_') && part.endsWith(']]')) {
            const entType = part.replace(/^\[\[PII_/, '').split('_')[0];
            let colorClass = 'bg-purple-500/20 text-purple-300 border-purple-500/40';
            if (entType.includes('AU') || entType.includes('TFN') || entType.includes('BSB') || entType.includes('MEDICARE')) {
              colorClass = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
            } else if (entType.includes('PERSON')) {
              colorClass = 'bg-blue-500/20 text-blue-300 border-blue-500/40';
            }
            return (
              <span
                key={i}
                className={`inline-flex items-center gap-1 font-mono text-[11px] px-1.5 py-0.5 rounded border font-semibold mx-0.5 ${colorClass}`}
                title={`PII Token: ${part}`}
              >
                <span>🛡️</span>
                <span>{part}</span>
              </span>
            );
          }
          return <span key={i}>{part}</span>;
        });
      };

      const renderMarkdownContent = (text, enableTokens = false, isUser = false) => {
        if (!text || typeof text !== 'string') return null;
        if (window.marked && typeof window.marked.parse === 'function') {
          try {
            window.marked.setOptions({
              gfm: true,
              breaks: true,
            });
            let parsedHtml = window.marked.parse(text);
            if (window.DOMPurify && typeof window.DOMPurify.sanitize === 'function') {
              parsedHtml = window.DOMPurify.sanitize(parsedHtml, {
                ADD_ATTR: ['target', 'rel'],
              });
            }
            if (enableTokens) {
              parsedHtml = parsedHtml.replace(/\[\[PII_([A-Z0-9_]+)\]\]/g, (match, entType) => {
                let colorClass = 'bg-purple-500/20 text-purple-300 border-purple-500/40';
                if (
                  entType.includes('AU') ||
                  entType.includes('TFN') ||
                  entType.includes('BSB') ||
                  entType.includes('MEDICARE')
                ) {
                  colorClass = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
                } else if (entType.includes('PERSON')) {
                  colorClass = 'bg-blue-500/20 text-blue-300 border-blue-500/40';
                }
                return `<span class="inline-flex items-center gap-1 font-mono text-[11px] px-1.5 py-0.5 rounded border font-semibold mx-0.5 ${colorClass}" title="PII Token: ${match}"><span>🛡️</span><span>${match}</span></span>`;
              });
            }
            const bubbleClass = isUser ? 'markdown-content-user' : 'markdown-content';
            return <div className={bubbleClass} dangerouslySetInnerHTML={{ __html: parsedHtml }} />;
          } catch (err) {
            console.error('Markdown rendering error:', err);
          }
        }
        return (
          <div className={`text-sm leading-relaxed whitespace-pre-wrap ${isUser ? 'font-sans' : 'font-sans'}`}>
            {enableTokens ? highlightTokens(text) : text}
          </div>
        );
      };

      const renderCollapsibleTelemetry = (msgId, meta) => {
        if (!meta) return null;
        const isExpanded = !!expandedLogs[msgId];
        const {
          activeTier,
          modelUsed,
          executionLocation,
          sovereigntyClassification,
          routingMode,
          latencyMs,
          wastedLatencyAvoidedMs,
          failoverOccurred,
          failoverHops,
          failoverLog,
          recoverySentinel,
          tier3Synced,
          tier3SyncStatus,
          piiTelemetry,
        } = meta;

        let badgeColor = 'bg-blue-500/10 border-blue-500/30 text-blue-400';
        let icon = '🌐';
        let label = 'Tier 1 Global';

        if (activeTier === 'TIER_2_REGIONAL') {
          badgeColor = 'bg-amber-500/10 border-amber-500/30 text-amber-400';
          icon = '🦘';
          label = 'Tier 2 Regional (AU-SYD)';
        } else if (activeTier === 'TIER_3_SOVEREIGN') {
          badgeColor = 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
          icon = '🔒';
          label = 'Tier 3 (On-Prem)';
        }

        return (
          <div className="mt-3 pt-3 border-t border-slate-800/80">
            {/* Accordion Toggle Bar */}
            <div className="flex flex-wrap items-center justify-between gap-2 text-xs">
              <div className="flex items-center gap-2 flex-wrap">
                <span className={`px-2 py-0.5 rounded-full border font-semibold flex items-center gap-1 ${badgeColor}`}>
                  <span>{icon}</span>
                  <span>{label}</span>
                </span>
                <span className="text-slate-400 font-mono text-[11px]">{modelUsed}</span>
                <span className="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-mono text-[11px]">
                  {latencyMs}ms
                </span>

                {piiTelemetry && piiTelemetry.enabled && (
                  <span className="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 font-semibold text-[11px] flex items-center gap-1 border border-purple-500/40">
                    <span>🛡️</span>
                    <span>Zero-PII Shield ({piiTelemetry.entitiesIntercepted} Intercepted)</span>
                  </span>
                )}

                {wastedLatencyAvoidedMs > 0 && (
                  <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-semibold text-[11px] flex items-center gap-1 border border-emerald-500/30">
                    <span>⚡</span>
                    <span>+{wastedLatencyAvoidedMs}ms Saved</span>
                  </span>
                )}

                {tokenomicsEnabled && (meta.costPer10kTurnsUsd !== undefined || meta.costPer1kTurnsUsd !== undefined) && (
                  <span className="px-1.5 py-0.5 rounded bg-slate-800 text-emerald-400 font-mono text-[11px]" title="Cost per 10,000 Turns">
                    ${(meta.costPer10kTurnsUsd ?? (meta.costPer1kTurnsUsd ? meta.costPer1kTurnsUsd * 10 : 0)).toFixed(2)}/10k
                  </span>
                )}

                {tier3Synced && (
                  <span className="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-300 font-semibold text-[11px] flex items-center gap-1 border border-emerald-500/30" title="Session state synchronized with Tier 3 Sovereign Redis store">
                    <span>🔄</span>
                    <span>Tier 3 Synced</span>
                  </span>
                )}

                {failoverOccurred && (
                  <span className="px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 font-semibold text-[11px] border border-rose-500/30">
                    ⚠️ Fallback Hop ({failoverHops})
                  </span>
                )}
              </div>

              <button
                onClick={() => toggleLog(msgId)}
                className="flex items-center gap-1.5 text-[11px] font-semibold text-blue-400 hover:text-blue-300 transition py-1 px-2 rounded-lg hover:bg-slate-800"
              >
                <span>{isExpanded ? '▼ Hide Routing & Telemetry Log' : '▶ Show Routing & Telemetry Log'}</span>
              </button>
            </div>

            {/* Collapsible Expanded Log Window */}
            {isExpanded && (
              <div className="mt-3 p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono space-y-3 transition-all">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <span className="text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                    Sovereign-Stream Routing &amp; Telemetry Log
                  </span>
                  <span className="px-2 py-0.5 rounded bg-slate-900 text-slate-300 text-[10px]">
                    Mode: {routingMode}
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-[11px]">
                  <div className="p-2.5 rounded-lg bg-slate-900/60 border border-slate-800/80 space-y-1">
                    <div className="text-blue-400 font-bold">// Execution Target &amp; Economics:</div>
                    <div className="text-slate-300">Tier: <span className="text-white font-semibold">{activeTier}</span></div>
                    <div className="text-slate-300">Location: <span className="text-white">{executionLocation}</span></div>
                    <div className="text-slate-300">Sovereignty: <span className="text-white">{sovereigntyClassification}</span></div>
                    {tokenomicsEnabled && (meta.costPer10kTurnsUsd !== undefined || meta.costPer1kTurnsUsd !== undefined) && (
                      <div className="text-slate-300">10k-Turn Cost: <span className="text-emerald-300 font-bold">${(meta.costPer10kTurnsUsd ?? (meta.costPer1kTurnsUsd ? meta.costPer1kTurnsUsd * 10 : 0)).toFixed(2)} USD</span></div>
                    )}
                  </div>

                  <div className="p-2.5 rounded-lg bg-slate-900/60 border border-slate-800/80 space-y-1">
                    <div className="text-emerald-400 font-bold">// Performance &amp; Bandwidth:</div>
                    <div className="text-slate-300">Total Latency: <span className="text-emerald-300 font-bold">{latencyMs}ms</span></div>
                    {tokenomicsEnabled && meta.inputTokens !== undefined && (
                      <div className="text-slate-300">Tokens: <span className="text-blue-300 font-bold">{meta.inputTokens} In / {meta.outputTokens} Out</span> ({meta.totalTokens} total)</div>
                    )}
                    <div className="text-slate-300">Wasted Timeout Avoided: <span className="text-emerald-300 font-bold">+{wastedLatencyAvoidedMs}ms</span></div>
                    {recoverySentinel && (
                      <div className="text-slate-300 truncate" title={recoverySentinel.message}>
                        Sentinel: <span className="text-amber-300">{recoverySentinel.status}</span>
                      </div>
                    )}
                  </div>

                  {/* Zero-PII Egress Shield Telemetry Card */}
                  {piiTelemetry && piiTelemetry.enabled && (
                    <div className="p-2.5 rounded-lg bg-purple-950/30 border border-purple-800/60 space-y-2 col-span-1 md:col-span-2">
                      <div className="text-purple-300 font-bold flex items-center justify-between">
                        <span>🛡️ Zero-PII Egress Shield Telemetry:</span>
                        <span className="px-2 py-0.5 rounded text-[10px] bg-purple-500/20 text-purple-200 border border-purple-500/40">
                          🔒 Zero-Egress Verified (Scan: {piiTelemetry.scanDurationMs}ms)
                        </span>
                      </div>
                      <div className="text-slate-300 text-xs flex flex-wrap items-center gap-2">
                        <span className="text-slate-400">Intercepted Entities ({piiTelemetry.entitiesIntercepted}):</span>
                        {piiTelemetry.entities.map((ent, idx) => (
                          <span key={idx} className="px-2 py-0.5 rounded bg-slate-900 border border-purple-500/30 text-purple-300 font-mono text-[10px]">
                            {ent.type}: <span className="text-white">{ent.maskedSnippet}</span> → <span className="text-amber-300">{ent.token}</span>
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="p-2.5 rounded-lg bg-slate-900/60 border border-slate-800/80 space-y-1 col-span-1 md:col-span-2">
                    <div className="text-emerald-400 font-bold flex items-center justify-between">
                      <span>// Tier 3 Sovereign Redis Session Sync:</span>
                      <span className={`px-2 py-0.5 rounded text-[10px] ${tier3Synced ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-300'}`}>
                        {tier3Synced ? '✔ Synced with Tier 3 (On-Prem)' : '⚠ Sync Pending'}
                      </span>
                    </div>
                    <div className="text-slate-300">
                      Replication Status: <span className="text-white font-semibold">{tier3SyncStatus || 'Synchronized (Dual-Tier Replicated)'}</span>
                    </div>
                    <div className="text-slate-400 text-[10px]">
                      Standby Target: <span className="text-purple-300">Redis (127.0.0.1:6379 DB 1)</span> • Ensures zero-loss session continuity across AU-SYD tiers.
                    </div>
                  </div>
                </div>

                <div>
                  <div className="text-amber-400 font-bold mb-1.5">// Failover Hop Sequence:</div>
                  <div className="space-y-1.5">
                    {failoverLog.map((hop, idx) => (
                      <div
                        key={idx}
                        className={`p-2 rounded-lg flex flex-col md:flex-row md:items-center justify-between gap-1 border ${
                          hop.status === 'SUCCESS'
                            ? 'bg-emerald-500/5 border-emerald-500/20 text-emerald-300'
                            : 'bg-rose-500/5 border-rose-500/20 text-rose-300'
                        }`}
                      >
                        <div className="flex items-center gap-2">
                          <span className="font-bold">Hop {idx + 1}: {hop.tier}</span>
                          <span className="text-slate-400">({hop.attemptedModel})</span>
                        </div>
                        <div className="flex items-center gap-3">
                          <span>{hop.status}</span>
                          <span className="text-slate-400 font-mono">{hop.durationMs}ms</span>
                        </div>
                        {hop.error && (
                          <div className="w-full text-[10px] text-rose-400 font-sans mt-0.5 truncate">
                            Error: {hop.error}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      return (
        <main className="flex-1 flex flex-col justify-between bg-slate-950 h-full min-w-0 overflow-hidden">
          {/* Dual Context Inspector Tab Bar - Conditional on Sovereign PII Cleanser */}
          {enablePiiTokenizer && (
            <div className="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-6 py-2.5 flex items-center justify-between gap-4">
              <div className="flex items-center gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('user')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${
                    effectiveTab === 'user'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                  }`}
                >
                  <span>💬</span>
                  <span>Clean User View</span>
                </button>
                <button
                  onClick={() => setActiveTab('shield')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${
                    effectiveTab === 'shield'
                      ? 'bg-purple-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                  }`}
                >
                  <span>🛡️</span>
                  <span>Sovereign Shield View</span>
                </button>
                <button
                  onClick={() => setActiveTab('diff')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${
                    effectiveTab === 'diff'
                      ? 'bg-amber-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                  }`}
                >
                  <span>🔀</span>
                  <span>Split / Diff View</span>
                </button>
              </div>

              <div className="text-[11px] text-slate-400 font-mono hidden md:flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                <span>Parallel Context Window Synchronized</span>
              </div>
            </div>
          )}

          <div className="flex-1 overflow-y-auto p-6 space-y-6">
            {messages.length === 0 ? (
              <div className="h-full flex flex-col items-center justify-center text-center max-w-xl mx-auto space-y-4 text-slate-400 py-6">
                <div className="w-12 h-12 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-2xl text-blue-400 shadow-md">
                  🦘
                </div>
                <div className="space-y-1">
                  <h3 className="text-base font-bold text-white">
                    Project Sovereign-Stream
                  </h3>
                  <p className="text-xs text-slate-400 max-w-md mx-auto">
                    {modeMetadata.description}
                  </p>
                </div>

                {/* Simplified Suggestion Grid: Title (Intent) + Prompt */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full pt-2">
                  {activeChips.map((chip) => (
                    <button
                      key={chip.id}
                      onClick={() => onSendMessage(chip.prompt)}
                      className="p-3.5 text-left rounded-xl bg-slate-900 border border-slate-800 hover:border-blue-500/50 hover:bg-slate-850 transition group shadow-sm flex flex-col space-y-1.5"
                    >
                      <div className="text-xs font-semibold text-blue-400 group-hover:text-blue-300 transition">
                        {chip.title}
                      </div>
                      <div className="text-xs text-slate-300 font-sans leading-relaxed">
                        "{chip.prompt}"
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              messages.map((msg) => {
                const tokenizedUserPrompt = msg.metadata?.tokenizedPrompt;
                const tokenizedResp = msg.metadata?.tokenizedResponse;

                let displayContent = msg.content;
                if (effectiveTab === 'shield') {
                  if (msg.role === 'user' && tokenizedUserPrompt) {
                    displayContent = tokenizedUserPrompt;
                  } else if (msg.role === 'assistant' && tokenizedResp) {
                    displayContent = tokenizedResp;
                  }
                }

                if (effectiveTab === 'diff') {
                  return (
                    <div key={msg.id} className="w-full space-y-2">
                      <div className="text-[10px] font-mono uppercase tracking-wider text-slate-400 flex items-center justify-between">
                        <span>{msg.role === 'user' ? '👤 User Turn' : '🤖 Assistant Turn'}</span>
                        <span>{msg.timestamp}</span>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div className="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs text-slate-200 space-y-1">
                          <div className="text-[10px] font-bold text-blue-400 uppercase tracking-wide">

                          </div>
                          {renderMarkdownContent(msg.content, false, false)}

                        onClick={() => setSkillTab('cloud')}
                        className={`px-3 py-1.5 rounded-lg text-xs font-mono flex items-center gap-1.5 transition cursor-pointer ${
                          skillTab === 'cloud'
                            ? 'bg-blue-600/30 text-blue-300 border border-blue-500/50 font-bold'
                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                        }`}
                      >
                        <span>☁️</span>
                        <span>Managed Cloud Registry (Tiers 1 &amp; 2)</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => setSkillTab('enclave')}
                        className={`px-3 py-1.5 rounded-lg text-xs font-mono flex items-center gap-1.5 transition cursor-pointer ${
                          skillTab === 'enclave'
                            ? 'bg-purple-600/30 text-purple-300 border border-purple-500/50 font-bold'
                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                        }`}
                      >
                        <span>🔒</span>
                        <span>Baked Enclave Disk (Tier 3 · Cord-Cut Ready)</span>
                      </button>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={handleSyncToEnclave}
                        disabled={isSyncing}
                        className="px-3 py-1.5 rounded-lg bg-purple-900/40 hover:bg-purple-800/60 active:bg-purple-700/60 text-purple-200 text-xs font-mono flex items-center gap-1.5 transition border border-purple-500/40 shadow-sm cursor-pointer disabled:opacity-50"
                        title="Synchronize and bake current Cloud Skill into Tier 3 Enclave VM disk"
                      >
                        <span>{isSyncing ? '⏳' : '🔄'}</span>
                        <span>{isSyncing ? 'Baking into Enclave...' : 'Sync to Enclave VM'}</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          navigator.clipboard.writeText(RAW_SKILL_MD);
                          setCopied(true);
                          setTimeout(() => setCopied(false), 2000);
                        }}
                        className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 text-xs font-mono flex items-center gap-1.5 transition border border-slate-700 shadow-sm cursor-pointer"
                        title="Copy entire SKILL.md text to clipboard"
                      >
                        <span>{copied ? '✓' : '📋'}</span>
                        <span>{copied ? 'Copied!' : 'Copy Raw'}</span>
                      </button>
                    </div>
                  </div>

                  {/* Sync Status Banner */}
                  {syncMsg && (
                    <div className="px-3 py-2 rounded-lg bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 text-xs font-mono flex items-center gap-2 animate-in fade-in">
                      <span>●</span>
                      <span>{syncMsg}</span>
                    </div>
                  )}

                  {/* Provenance Metadata Bar */}
                  <div className="flex flex-wrap items-center justify-between gap-2 px-3 py-2 bg-slate-950/90 rounded-xl border border-purple-500/30 text-xs font-mono">
                    <div className="flex items-center gap-2 text-slate-300">
                      <span className="text-purple-400">📄</span>
                      <span className="font-bold text-white font-mono">
                        {skillTab === 'cloud'
                          ? 'gs://au-fsi-sovereign-skills/apra_underwriting/SKILL.md'
                          : '/var/sovereign/skills/apra_underwriting/SKILL.md'}
                      </span>
                      <span
                        className={`px-2 py-0.5 rounded text-[10px] font-bold border font-mono ${
                          skillTab === 'cloud'
                            ? 'bg-blue-500/20 text-blue-300 border-blue-500/40'
                            : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                        }`}
                      >
                        {skillTab === 'cloud'
                          ? 'CMEK Encrypted · AU-SYD Regional Registry'
                          : 'Baked On-Disk · Airgapped Offline Autonomy'}
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-400 font-mono">
                      {skillTab === 'cloud' ? 'Managed Cloud Store' : 'Offline Cord-Cut Ready ✓'}
                    </div>
                  </div>

                  {/* Raw Monospace Text Editor Field */}
                  <div className="relative rounded-xl border border-slate-800 bg-slate-950 overflow-hidden shadow-2xl">
                    <div className="p-4 font-mono text-xs text-slate-200 leading-relaxed overflow-x-auto whitespace-pre select-text selection:bg-purple-900/60 selection:text-white max-h-[54vh] bg-slate-950 font-mono">
                      {RAW_SKILL_MD}
                    </div>
                  </div>

                  {/* Footer Note and Close */}
                  <div className="pt-2 flex flex-wrap items-center justify-between gap-2">
                    <span className="text-[11px] font-mono text-slate-400 flex items-center gap-1.5">
                      <span className="text-emerald-400 font-bold">●</span>
                      <span>
                        {skillTab === 'cloud'
                          ? 'Tiers 1 & 2 execute against Cloud Registry with CMEK key au-fsi-cmek'
                          : 'Tier 3 executes strictly from local disk (/var/sovereign/skills) with zero internet egress'}
                      </span>
                    </span>
                    <button
                      type="button"
                      onClick={onClose}
                      className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition cursor-pointer"
                    >
                      Close
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }


    function App() {
      const [sessionId, setSessionId] = useState(() => {
        const stored = localStorage.getItem('sovereign_session_id');
        if (stored) return stored;
        const newId = `session-${Date.now()}`;
        localStorage.setItem('sovereign_session_id', newId);
        return newId;
      });
      const [messages, setMessages] = useState([]);
      const [metadataHistory, setMetadataHistory] = useState([]);
      const [buildInfo, setBuildInfo] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [catalog, setCatalog] = useState([]);
      const [datasetSummary, setDatasetSummary] = useState(null);
      const [settingsInitialTab, setSettingsInitialTab] = useState(undefined);
      const [architectureDescriptions, setArchitectureDescriptions] = useState(() => {
        try {
          const saved = localStorage.getItem('sovereign_architecture_descriptions');
          if (saved) {
            return { ...DEFAULT_ARCHITECTURE_DESCRIPTIONS, ...JSON.parse(saved) };
          }
        } catch (e) {
          console.error('Failed to parse cached architecture descriptions:', e);
        }
        return DEFAULT_ARCHITECTURE_DESCRIPTIONS;
      });
      const [activeArchitectureModal, setActiveArchitectureModal] = useState(null);
      const [tierSettings, setTierSettings] = useState({
        TIER_1_GLOBAL: { region: 'global', model: 'gemini-3.7-flash' },
        TIER_2_REGIONAL: { region: 'australia-southeast1', model: 'gemini-2.5-flash' },
        TIER_3_SOVEREIGN: { region: 'airgap-vpc-ausyd', model: 'google/gemma-2-9b-it' },
      });
      const [controls, setControls] = useState({
        stage: 1,
        stageZeroRuntimeEnabled: true,
        stageZeroIntelligenceEnabled: true,
        failedTiers: [],
        forcedTier: 'AUTO',
        enablePiiTokenizer: false,
        enterpriseDataEnabled: false,
        tokenomicsEnabled: false,
        tierSettings: {
          TIER_1_GLOBAL: { region: 'global', model: 'gemini-3.7-flash' },
          TIER_2_REGIONAL: { region: 'australia-southeast1', model: 'gemini-2.5-flash' },
          TIER_3_SOVEREIGN: { region: 'airgap-vpc-ausyd', model: 'google/gemma-2-9b-it' },
        },
      });

      useEffect(() => {
        // Load dataset summary info
        fetch('/api/dataset')
          .then((res) => res.json())
          .then((data) => {
            if (data) {
              setDatasetSummary(data);
              setControls((prev) => ({
                ...prev,
                enterpriseDataEnabled: data.enabled !== undefined ? data.enabled : true,
              }));
            }
          })
          .catch((err) => console.error('Failed to load dataset info:', err));

        // Load synchronized session history if available
        fetch(`/api/session/${sessionId}`)
          .then((res) => res.json())
          .then((data) => {
            if (data && data.messages && data.messages.length > 0) {
              const loadedMsgs = data.messages.map((m, idx) => ({
                id: `msg-${idx}-${m.role}`,
                role: m.role === 'model' || m.role === 'assistant' ? 'assistant' : 'user',
                content: m.content,
                timestamp: '',
              }));
              setMessages(loadedMsgs);
            }
          })
          .catch((err) => console.error('Failed to load session history:', err));

        fetch('/api/models')
          .then((res) => res.json())
          .then((data) => {
            if (data.catalog) setCatalog(data.catalog);
            if (data.activeTierSettings) {
              setTierSettings(data.activeTierSettings);
              setControls((prev) => ({ ...prev, tierSettings: data.activeTierSettings }));
            }
            if (data.architectureDescriptions) {
              setArchitectureDescriptions((prev) => ({
                ...prev,
                ...data.architectureDescriptions,
              }));
            }
            if (data.buildInfo) {
              setBuildInfo(data.buildInfo);
            } else {
              fetch('/api/build-info')
                .then((r) => r.json())
                .then((info) => setBuildInfo(info))
                .catch(() => {});
            }
          })
          .catch((err) => console.error('Failed to load regional models catalog:', err));
      }, [sessionId]);

      const handleSaveSettings = async (updatedSettings) => {
        setTierSettings(updatedSettings);
        setControls((prev) => ({ ...prev, tierSettings: updatedSettings }));

        try {
          await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tierSettings: updatedSettings }),
          });
        } catch (err) {
          console.error('Failed to sync tier settings to backend:', err);
        }
      };

      const handleSaveArchitectureDescriptions = async (updated) => {
        setArchitectureDescriptions(updated);
        try {
          localStorage.setItem('sovereign_architecture_descriptions', JSON.stringify(updated));
        } catch (e) {
          console.error('Failed to cache architecture descriptions:', e);
        }

        try {
          await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ architectureDescriptions: updated }),
          });
        } catch (err) {
          console.error('Failed to sync architecture descriptions to backend:', err);
        }
      };

      const handleOpenSettings = (tab) => {
        setSettingsInitialTab(tab || 'tiers');
        setIsSettingsOpen(true);
      };

      const lastMetadata = metadataHistory[metadataHistory.length - 1];

      const handleSendMessage = async (text) => {
        const userMsgId = `msg-${Date.now()}-user`;
        const userMsg = {
          id: userMsgId,
          role: 'user',
          content: text,
          timestamp: new Date().toLocaleTimeString(),
        };

        setMessages((prev) => [...prev, userMsg]);
        setIsLoading(true);

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId,
              message: text,
              simulationControls: {
                ...controls,
                tierSettings: tierSettings,
              },
            }),
          });

          if (!response.ok) {
            let errorDetail = `Gateway returned HTTP ${response.status}`;
            try {
              const errData = await response.json();
              if (errData && errData.detail) {
                errorDetail = errData.detail;
              }
            } catch (_) {}
            throw new Error(errorDetail);
          }

          const data = await response.json();
          const meta = data.executionMetadata;

          // Update user message with tokenized prompt metadata
          if (meta && meta.tokenizedPrompt) {
            setMessages((prev) =>
              prev.map((m) =>
                m.id === userMsgId ? { ...m, metadata: { ...m.metadata, tokenizedPrompt: meta.tokenizedPrompt } } : m
              )
            );
          }

          const assistantMsg = {
            id: `msg-${Date.now()}-assistant`,
            role: 'assistant',
            content: data.content,
            timestamp: new Date().toLocaleTimeString(),
            metadata: meta,
          };

          setMessages((prev) => [...prev, assistantMsg]);
          setMetadataHistory((prev) => [...prev, meta]);
        } catch (err) {
          const errorMsg = {
            id: `msg-${Date.now()}-error`,
            role: 'assistant',
            content: `[ADK Gateway Communication Error] Failed to complete chat turn: ${err.message}`,
            timestamp: new Date().toLocaleTimeString(),
          };
          setMessages((prev) => [...prev, errorMsg]);
        } finally {
          setIsLoading(false);
        }
      };

      const [isResettingDemo, setIsResettingDemo] = useState(false);

      const handleResetChat = () => {
        setMessages([]);
        setMetadataHistory([]);
        const newId = `session-${Date.now()}`;
        localStorage.setItem('sovereign_session_id', newId);
        setSessionId(newId);
      };

      const handleResetDemo = async () => {
        setIsResettingDemo(true);
        try {
          // 1. Clear frontend chat & metadata state
          setMessages([]);
          setMetadataHistory([]);
          const newId = `session-${Date.now()}`;
          localStorage.setItem('sovereign_session_id', newId);
          setSessionId(newId);

          // 2. Reset frontend stage controls to Stage 1 (PII Off, Tools Off, Econ Off, Auto routing, no failed tiers)
          setControls((prev) => ({
            ...prev,
            stage: 1,
            stageZeroRuntimeEnabled: true,
            stageZeroIntelligenceEnabled: true,
            enablePiiTokenizer: false,
            enterpriseDataEnabled: false,
            tokenomicsEnabled: false,
            forcedTier: 'AUTO',
            failedTiers: [],
          }));

          // 3. Call backend endpoint to clear Redis / memory, reset defaults, and verify Tier 3 / Gemma
          const res = await fetch('/api/demo/reset', { method: 'POST' });
          if (res.ok) {
            const data = await res.json();
            if (data.datasetSummary) {
              setDatasetSummary(data.datasetSummary);
            }
            if (data.tierSettings) {
              setTierSettings(data.tierSettings);
              setControls((prev) => ({ ...prev, tierSettings: data.tierSettings }));
            }
          }
        } catch (err) {
          console.error('Failed to reset demo:', err);
        } finally {
          setIsResettingDemo(false);
        }
      };

      const handleToggleStageZeroRuntime = async (enabled) => {
        setControls((prev) => ({ ...prev, stageZeroRuntimeEnabled: enabled }));
        try {
          await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stageZeroRuntimeEnabled: enabled }),
          });
        } catch (err) {
          console.error('Failed to sync stageZeroRuntimeEnabled:', err);
        }
      };

      const handleToggleStageZeroIntelligence = async (enabled) => {
        setControls((prev) => ({ ...prev, stageZeroIntelligenceEnabled: enabled }));
        try {
          await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stageZeroIntelligenceEnabled: enabled }),
          });
        } catch (err) {
          console.error('Failed to sync stageZeroIntelligenceEnabled:', err);
        }
      };

      const handleSelectStage = async (stage) => {
        handleResetChat();
        const isStage0 = stage === 0;
        const isPii = stage === 2 || stage === 3 || stage === 4;
        const isEnterprise = stage === 3 || stage === 4;
        const isTokenomics = stage === 4;

        setControls((prev) => ({
          ...prev,
          stage: stage,
          stageZeroRuntimeEnabled: isStage0 ? false : true,
          stageZeroIntelligenceEnabled: isStage0 ? false : true,
          enablePiiTokenizer: isPii,
          enterpriseDataEnabled: isEnterprise,
          tokenomicsEnabled: isTokenomics,
          forcedTier: 'AUTO',
          failedTiers: [],
        }));

        try {
          await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              stageZeroRuntimeEnabled: isStage0 ? false : true,
              stageZeroIntelligenceEnabled: isStage0 ? false : true,
              enterpriseDataEnabled: isEnterprise,
              tokenomicsEnabled: isTokenomics,
            }),
          });
          await fetch('/api/dataset/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: isEnterprise }),
          });
        } catch (err) {
          console.error('Failed to sync stage settings:', err);
        }
      };

      const currentStage =
        controls.stage !== undefined
          ? controls.stage
          : controls.enablePiiTokenizer && controls.enterpriseDataEnabled && controls.tokenomicsEnabled
          ? 4
          : controls.enablePiiTokenizer && controls.enterpriseDataEnabled && !controls.tokenomicsEnabled
          ? 3
          : controls.enablePiiTokenizer && !controls.enterpriseDataEnabled && !controls.tokenomicsEnabled
          ? 2
          : !controls.enablePiiTokenizer && !controls.enterpriseDataEnabled && !controls.tokenomicsEnabled && (controls.stageZeroRuntimeEnabled === false || controls.stageZeroIntelligenceEnabled === false)
          ? 0
          : 1;

      const isEnterpriseActive = controls.enterpriseDataEnabled ?? datasetSummary?.enabled ?? false;

      return (
        <div className="h-screen overflow-hidden flex flex-col bg-slate-950 font-sans text-slate-100">
          <TelemetryHeader
            lastMetadata={lastMetadata}
            buildInfo={buildInfo}
            datasetSummary={datasetSummary}
            enterpriseDataEnabled={isEnterpriseActive}
            onOpenSettings={() => setIsSettingsOpen(true)}
          />
          <div className="flex flex-1 min-h-0 overflow-hidden">
            <ChaosPanel
              controls={controls}
              onChange={(newControls) => setControls({ ...newControls, tierSettings })}
              onResetChat={handleResetChat}
              onResetDemo={handleResetDemo}
              isResettingDemo={isResettingDemo}
              onOpenSettings={(tab) => handleOpenSettings(tab)}
              onSelectStage={handleSelectStage}
              onOpenArchitectureModal={setActiveArchitectureModal}
              messages={messages}
              lastMetadata={lastMetadata}
            />
            {currentStage === 0 ? (
              <StageZeroGenesisLab
                runtimeEnabled={controls.stageZeroRuntimeEnabled ?? false}
                intelligenceEnabled={controls.stageZeroIntelligenceEnabled ?? false}
                onToggleRuntime={handleToggleStageZeroRuntime}
                onToggleIntelligence={handleToggleStageZeroIntelligence}
                onAdvanceToStageOne={() => handleSelectStage(1)}
              />
            ) : (
              <ChatWindow
                messages={messages}
                isLoading={isLoading}
                onSendMessage={handleSendMessage}
                enablePiiTokenizer={controls.enablePiiTokenizer}
                enterpriseDataEnabled={isEnterpriseActive}
                tokenomicsEnabled={controls.tokenomicsEnabled}
              />
            )}
          </div>

          {/* Metadata Footer */}
          <footer className="bg-slate-900 border-t border-slate-800 px-6 py-2.5 flex flex-wrap items-center gap-3 shrink-0 z-20 text-xs font-mono">
            <div className="flex items-center gap-2.5">
              <div className="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse" />
              <span className="font-bold text-xs tracking-tight text-white font-sans">Project Sovereign-Stream</span>
            </div>
            <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-xs font-mono border border-slate-700">
              ADK 3-Tier Sovereign Cascade
            </span>
            {buildInfo && (
              <>
                <span className="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 text-xs font-mono flex items-center gap-1.5" title="Active Git Branch">
                  <span className="text-slate-400">Branch:</span>
                  <span className="text-emerald-400 font-semibold">{buildInfo.branch}</span>
                </span>
                <span className="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 text-xs font-mono flex items-center gap-1.5" title="Server Build Timestamp">
                  <span className="text-slate-400">Build:</span>
                  <span className="text-slate-300">{buildInfo.buildTime}</span>
                </span>
              </>
            )}
          </footer>

          <ArchitectureInfoModal
            modalState={activeArchitectureModal}
            onClose={() => setActiveArchitectureModal(null)}
            descriptions={architectureDescriptions}
            datasetSummary={datasetSummary}
            onOpenSettings={(tab) => handleOpenSettings(tab)}
          />

          <SettingsModal
            isOpen={isSettingsOpen}
            onClose={() => setIsSettingsOpen(false)}
            catalog={catalog}
            tierSettings={tierSettings}
            onSaveSettings={handleSaveSettings}
            controls={controls}
            onUpdateControls={(newControls) => setControls(newControls)}
            onDatasetUpdate={(updated) => setDatasetSummary(updated)}
            architectureDescriptions={architectureDescriptions}
            onSaveArchitectureDescriptions={handleSaveArchitectureDescriptions}
            initialTab={settingsInitialTab}
          />
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        console.error('ErrorBoundary caught:', error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 text-slate-100 font-sans">
              <div className="max-w-xl w-full bg-slate-900 border border-rose-500/50 rounded-2xl p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-3 text-rose-400">
                  <span className="text-2xl">⚠️</span>
                  <h1 className="text-base font-bold">Application Error Encountered</h1>
                </div>
                <p className="text-xs text-slate-300 font-mono bg-slate-950 p-3 rounded-lg border border-slate-800 break-words whitespace-pre-wrap">
                  {this.state.error?.toString() || 'Unknown runtime error'}
                </p>
                <div className="flex items-center gap-3 pt-2">
                  <button
                    onClick={() => {
                      localStorage.clear();
                      window.location.reload();
                    }}
                    className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition"
                  >
                    Clear Local Cache &amp; Reload
                  </button>
                  <button
                    onClick={() => window.location.reload()}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition"
                  >
                    Reload Page
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
