<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Sovereign-Stream • 3-Tier Resilient AI Failover Demo</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'JetBrains Mono', system-ui, -apple-system, sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.7); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function TelemetryHeader({ lastMetadata, buildInfo, datasetSummary, enterpriseDataEnabled, onOpenSettings, onResetChat }) {
      const isDatasetActive = (enterpriseDataEnabled && datasetSummary?.enabled !== false) || datasetSummary?.enabled === true;
      if (!lastMetadata) {
        return (
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-3 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center flex-wrap gap-3">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-blue-500 animate-pulse" />
                <span className="font-bold text-sm tracking-tight text-white">Project Sovereign-Stream</span>
              </div>
              <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-xs font-mono border border-slate-700">
                ADK 3-Tier Sovereign Cascade
              </span>
              {isDatasetActive && (
                <button
                  onClick={onOpenSettings}
                  className="px-2.5 py-0.5 rounded-full bg-amber-500/15 text-amber-300 text-xs font-mono border border-amber-500/40 flex items-center gap-1.5 hover:bg-amber-500/25 transition shadow-sm"
                  title="Active Australian Loan Book Ingested & Active • Click to manage Trix datasets"
                >
                  <span>📊</span>
                  <span className="font-semibold text-amber-200">Active Loan Book:</span>
                  <span>{datasetSummary?.rowCount || 5} Mortgages</span>
                  <span className="hidden xl:inline text-[11px] text-amber-400/80">(AU-SYD CMEK)</span>
                </button>
              )}
              {buildInfo && (
                <>
                  <span className="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 text-xs font-mono flex items-center gap-1.5" title="Active Git Branch">
                    <span className="text-slate-400">Branch:</span>
                    <span className="text-emerald-400 font-semibold">{buildInfo.branch}</span>
                  </span>
                  <span className="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 text-xs font-mono flex items-center gap-1.5" title="Server Build Timestamp">
                    <span className="text-slate-400">Build:</span>
                    <span className="text-slate-300">{buildInfo.buildTime}</span>
                  </span>
                </>
              )}
            </div>
            <div className="flex items-center gap-3">
              <div className="text-xs text-slate-400 font-mono hidden sm:inline">
                Ready for executive demonstration • Send a prompt below
              </div>
              {onResetChat && (
                <button
                  onClick={onResetChat}
                  className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 hover:text-white text-xs font-semibold flex items-center gap-1.5 transition shadow-sm"
                  title="Clear chat transcript and reset session state"
                >
                  <span>🔄</span>
                  <span>Reset Chat</span>
                </button>
              )}
              {onOpenSettings && (
                <button
                  onClick={onOpenSettings}
                  className="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-lg shadow-blue-500/25 border border-blue-400/40 flex items-center gap-1.5 transition whitespace-nowrap"
                  title="Open Regional Catalog, Enclave Management, and Live Telemetry Logs"
                >
                  <span>⚙️</span>
                  <span>Settings &amp; Logs</span>
                </button>
              )}
            </div>
          </header>
        );
      }

      const { activeTier, modelUsed, executionLocation, latencyMs, routingMode, recoverySentinel } = lastMetadata;

      const getTierBadge = () => {
        switch (activeTier) {
          case 'TIER_1_GLOBAL':
            return {
              icon: '🌐',
              label: 'Tier 1 • Global Public',
              color: 'bg-blue-500/20 text-blue-400 border-blue-500/40',
            };
          case 'TIER_2_REGIONAL':
            return {
              icon: '🦘',
              label: 'Tier 2 • Regional AU-SYD',
              color: 'bg-amber-500/20 text-amber-400 border-amber-500/40',
            };
          case 'TIER_3_SOVEREIGN':
            return {
              icon: '🔒',
              label: 'Tier 3 • Airgapped VPC',
              color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40',
            };
          default:
            return {
              icon: '🌐',
              label: 'Tier 1 • Global Public',
              color: 'bg-blue-500/20 text-blue-400 border-blue-500/40',
            };
        }
      };

      const badge = getTierBadge();

      return (
        <header className="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-6 py-3 flex flex-col md:flex-row md:items-center justify-between gap-3 sticky top-0 z-20 shadow-md">
          <div className="flex items-center flex-wrap gap-3">
            <span className="font-bold text-sm text-white tracking-tight">Project Sovereign-Stream</span>
            <span className={`px-2.5 py-1 rounded-full text-xs font-semibold border flex items-center gap-1.5 ${badge.color}`}>
              <span>{badge.icon}</span>
              <span>{badge.label}</span>
            </span>
            <span className="px-2.5 py-1 rounded bg-slate-800 text-slate-300 text-xs font-mono border border-slate-700">
              Model: <span className="text-white font-semibold">{modelUsed}</span>
            </span>
            {isDatasetActive && (
              <button
                onClick={onOpenSettings}
                className="px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-300 text-xs font-mono border border-amber-500/40 flex items-center gap-1.5 hover:bg-amber-500/25 transition shadow-sm"
                title="Active Australian Loan Book Ingested & Active • Click to manage Trix datasets"
              >
                <span>📊</span>
                <span className="font-semibold text-amber-200">Active Loan Book:</span>
                <span>{datasetSummary?.rowCount || 5} Mortgages</span>
                <span className="hidden xl:inline text-[11px] text-amber-400/80">(AU-SYD CMEK)</span>
              </button>
            )}
            {buildInfo && (
              <>
                <span className="px-2.5 py-1 rounded bg-slate-800 text-slate-300 text-xs font-mono border border-slate-700 flex items-center gap-1.5" title="Active Git Branch">
                  <span className="text-slate-400">Branch:</span>
                  <span className="text-emerald-400 font-semibold">{buildInfo.branch}</span>
                </span>
                <span className="px-2.5 py-1 rounded bg-slate-800 text-slate-300 text-xs font-mono border border-slate-700 hidden sm:flex items-center gap-1.5" title="Server Build Timestamp">
                  <span className="text-slate-400">Build:</span>
                  <span className="text-slate-300">{buildInfo.buildTime}</span>
                </span>
              </>
            )}
            <span className="text-xs text-slate-400 font-mono hidden xl:inline">
              {executionLocation}
            </span>
          </div>

          <div className="flex items-center gap-3">
            <div className="px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-800 text-xs font-mono flex items-center gap-2">
              <span className="text-slate-400">TTFT Latency:</span>
              <span className={`font-bold ${latencyMs < 700 ? 'text-emerald-400' : 'text-amber-400'}`}>
                {latencyMs}ms
              </span>
              {routingMode === 'STICKY_FALLBACK' && (
                <span className="px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 text-[10px] font-sans font-semibold">
                  Sticky (0ms penalty)
                </span>
              )}
            </div>

            {recoverySentinel && (
              <div
                className={`px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-2 border ${
                  recoverySentinel.status === 'FORCE_FAILED'
                    ? 'bg-rose-500/15 border-rose-500/40 text-rose-300'
                    : recoverySentinel.status === 'PROBING_BACKGROUND'
                    ? 'bg-amber-500/10 border-amber-500/30 text-amber-300 animate-pulse'
                    : recoverySentinel.status === 'PROMOTED_RESTORED'
                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
                    : 'bg-slate-800 border-slate-700 text-slate-400'
                }`}
                title={recoverySentinel.message}
              >
                {recoverySentinel.status === 'FORCE_FAILED' && (
                  <span className="flex items-center gap-1.5">
                    <span>🚨 Forced Fault:</span>
                    <span className="font-mono text-rose-200">
                      {recoverySentinel.failedTiers && recoverySentinel.failedTiers.length > 0
                        ? recoverySentinel.failedTiers
                            .map((t) =>
                              t === 'TIER_1_GLOBAL'
                                ? 'Tier 1 (Global)'
                                : t === 'TIER_2_REGIONAL'
                                ? 'Tier 2 (AU-SYD)'
                                : 'Tier 3 (VPC)'
                            )
                            .join(' + ') + ' Failed'
                        : 'Chaos Fault Active'}
                    </span>
                  </span>
                )}
                {recoverySentinel.status === 'PROBING_BACKGROUND' && (
                  <span>🔄 Sentinel Probing: {recoverySentinel.consecutiveSuccesses}/{recoverySentinel.requiredSuccesses} Healthy</span>
                )}
                {recoverySentinel.status === 'PROMOTED_RESTORED' && (
                  <span>✅ Global Restored: Auto-Promoted</span>
                )}
                {recoverySentinel.status === 'IDLE_HEALTHY' && (
                  <span>🟢 Global Healthy</span>
                )}
                {recoverySentinel.status === 'PROBE_FAILED_HYSTERESIS_RESET' && (
                  <span>⚠️ Sentinel: Probe reset (SLA breach)</span>
                )}
              </div>
            )}

            {onResetChat && (
              <button
                onClick={onResetChat}
                className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 hover:text-white text-xs font-semibold flex items-center gap-1.5 transition shadow-sm"
                title="Clear chat transcript and reset session state"
              >
                <span>🔄</span>
                <span className="hidden sm:inline">Reset</span>
              </button>
            )}

            {onOpenSettings && (
              <button
                onClick={onOpenSettings}
                className="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-lg shadow-blue-500/25 border border-blue-400/40 flex items-center gap-1.5 transition whitespace-nowrap"
                title="Open Regional Catalog, Enclave Management, and Live Telemetry Logs"
              >
                <span>⚙️</span>
                <span>Settings &amp; Logs</span>
              </button>
            )}
          </div>
        </header>
      );
    }

    function ChaosPanel({ controls, onChange, metadataList, onResetChat }) {
      const totalTurns = metadataList.length;
      const failoverTurns = metadataList.filter((m) => m.failoverOccurred).length;
      const stickyTurns = metadataList.filter((m) => m.routingMode === 'STICKY_FALLBACK').length;
      const totalSavedMs = metadataList.reduce((acc, m) => acc + (m.wastedLatencyAvoidedMs || 0), 0);

      const handleForcedTierChange = (tier) => {
        onChange({
          ...controls,
          forcedTier: tier,
          failedTiers: tier === 'AUTO' ? controls.failedTiers : [],
        });
      };

      const handleToggleFailTier = (tierId) => {
        if (controls.forcedTier !== 'AUTO') return;
        const currentFailed = controls.failedTiers || [];
        const isFailed = currentFailed.includes(tierId);
        const updatedFailed = isFailed
          ? currentFailed.filter((id) => id !== tierId)
          : [...currentFailed, tierId];
        onChange({ ...controls, failedTiers: updatedFailed });
      };

      const getEffectiveActiveTier = () => {
        const failed = controls.failedTiers || [];
        const tierOrder = ['TIER_1_GLOBAL', 'TIER_2_REGIONAL', 'TIER_3_SOVEREIGN'];
        const startIndex =
          controls.forcedTier !== 'AUTO'
            ? tierOrder.indexOf(controls.forcedTier)
            : 0;

        for (let i = Math.max(0, startIndex); i < tierOrder.length; i++) {
          if (!failed.includes(tierOrder[i])) {
            return tierOrder[i];
          }
        }
        return 'TIER_3_SOVEREIGN';
      };

      const activeTier = getEffectiveActiveTier();

      const getAgentCharacter = () => {
        let piiCleanserText = 'Disabled (Bypassed)';
        let piiCleanserColor = 'text-slate-500 font-semibold';
        if (controls.enablePiiTokenizer) {
          if (activeTier === 'TIER_3_SOVEREIGN') {
            piiCleanserText = 'Enclave Sidecar (AU-SYD)';
            piiCleanserColor = 'text-emerald-400 font-semibold';
          } else if (activeTier === 'TIER_2_REGIONAL') {
            piiCleanserText = 'Cloud Run (AU-SYD Domestic)';
            piiCleanserColor = 'text-amber-400 font-semibold';
          } else {
            piiCleanserText = 'Cloud Run (AU-SYD Border)';
            piiCleanserColor = 'text-amber-400 font-semibold';
          }
        }

        const skillText = activeTier === 'TIER_3_SOVEREIGN'
          ? 'APRA Enclave Rulebook (Local VPC)'
          : 'APRA Mortgage Underwriter (AU-SYD)';
        const skillColor = activeTier === 'TIER_3_SOVEREIGN'
          ? 'text-emerald-400 font-semibold'
          : 'text-amber-400 font-semibold';

        const toolText = activeTier === 'TIER_3_SOVEREIGN'
          ? 'calculate_customer_lvr (Airgap Enclave)'
          : 'calculate_customer_lvr (Local VM Engine)';
        const toolColor = 'text-emerald-400 font-semibold';

        const storageRestText = activeTier === 'TIER_3_SOVEREIGN'
          ? 'Local Enclave Disk Mirror (/src/data)'
          : 'gs://au-fsi-customer-assets/ (AU-SYD CMEK)';
        const storageRestColor = activeTier === 'TIER_3_SOVEREIGN'
          ? 'text-emerald-400 font-semibold'
          : 'text-amber-400 font-semibold';

        switch (activeTier) {
          case 'TIER_2_REGIONAL':
            return {
              name: 'Regional Agent',
              runtime: 'Vertex AI Agent Engine (AU-SYD)',
              runtimeColor: 'text-amber-400 font-semibold',
              inference: 'In-Country Vertex AI (AU-SYD)',
              inferenceColor: 'text-amber-400 font-semibold',
              memory: 'Vertex AI Managed Sessions (AU-SYD)',
              memoryColor: 'text-amber-400 font-semibold',
              piiCleanser: piiCleanserText,
              piiCleanserColor: piiCleanserColor,
              skill: skillText,
              skillColor: skillColor,
              tool: toolText,
              toolColor: toolColor,
              storageRest: storageRestText,
              storageRestColor: storageRestColor,
              color: 'amber',
              borderClass: 'border-amber-500/40 bg-gradient-to-b from-amber-950/40 to-slate-950',
              glowClass: 'shadow-lg shadow-amber-500/10',
              eyeColor: '#f59e0b',
              pulseClass: 'bg-amber-500',
            };
          case 'TIER_3_SOVEREIGN':
            return {
              name: 'Sovereign Enclave Agent',
              runtime: 'Private Isolated VPC Enclave',
              runtimeColor: 'text-emerald-400 font-semibold',
              inference: 'Self-Hosted Gemma 2 (Local)',
              inferenceColor: 'text-emerald-400 font-semibold',
              memory: 'Tier 3 Local Standby Replica',
              memoryColor: 'text-emerald-400 font-semibold',
              piiCleanser: piiCleanserText,
              piiCleanserColor: piiCleanserColor,
              skill: skillText,
              skillColor: skillColor,
              tool: toolText,
              toolColor: toolColor,
              storageRest: storageRestText,
              storageRestColor: storageRestColor,
              color: 'emerald',
              borderClass: 'border-emerald-500/40 bg-gradient-to-b from-emerald-950/40 to-slate-950',
              glowClass: 'shadow-lg shadow-emerald-500/10',
              eyeColor: '#10b981',
              pulseClass: 'bg-emerald-500',
            };
          case 'TIER_1_GLOBAL':
          default:
            return {
              name: 'Global Frontier Agent',
              runtime: 'Vertex AI Agent Engine (AU-SYD)',
              runtimeColor: 'text-amber-400 font-semibold',
              inference: 'Global Hyperscaler API',
              inferenceColor: 'text-blue-400 font-semibold',
              memory: 'Vertex AI Managed Sessions (AU-SYD)',
              memoryColor: 'text-amber-400 font-semibold',
              piiCleanser: piiCleanserText,
              piiCleanserColor: piiCleanserColor,
              skill: skillText,
              skillColor: skillColor,
              tool: toolText,
              toolColor: toolColor,
              storageRest: storageRestText,
              storageRestColor: storageRestColor,
              color: 'blue',
              borderClass: 'border-blue-500/40 bg-gradient-to-b from-blue-950/40 to-slate-950',
              glowClass: 'shadow-lg shadow-blue-500/10',
              eyeColor: '#3b82f6',
              pulseClass: 'bg-blue-500',
            };
        }
      };

      const agentChar = getAgentCharacter();

      return (
        <aside className="w-[340px] bg-slate-900 border-r border-slate-800 p-5 flex flex-col justify-between shrink-0 h-full overflow-y-auto">
          <div className="space-y-6">
            {/* Active Agent Character & Architecture Card */}
            <div
              className={`p-4 rounded-2xl border ${agentChar.borderClass} ${agentChar.glowClass} transition-all duration-300 space-y-3.5`}
            >
              <div className="flex items-center gap-3">
                <div className="relative shrink-0">
                  <div className="w-14 h-14 rounded-2xl bg-slate-900/90 border border-slate-700/80 flex items-center justify-center shadow-inner relative overflow-hidden">
                    <svg
                      className="w-9 h-9"
                      viewBox="0 0 36 36"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <rect
                        x="5"
                        y="10"
                        width="26"
                        height="20"
                        rx="7"
                        className="fill-slate-800 stroke-slate-600"
                        strokeWidth="1.5"
                      />
                      <path
                        d="M18 10V5"
                        className="stroke-slate-400"
                        strokeWidth="1.5"
                        strokeLinecap="round"
                      />
                      <circle
                        cx="18"
                        cy="4"
                        r="2.5"
                        fill={agentChar.eyeColor}
                        className="animate-pulse"
                      />
                      <rect
                        x="2"
                        y="16"
                        width="3"
                        height="8"
                        rx="1.5"
                        fill={agentChar.eyeColor}
                        fillOpacity="0.7"
                      />
                      <rect
                        x="31"
                        y="16"
                        width="3"
                        height="8"
                        rx="1.5"
                        fill={agentChar.eyeColor}
                        fillOpacity="0.7"
                      />
                      <circle cx="13" cy="19" r="3" fill={agentChar.eyeColor} />
                      <circle cx="23" cy="19" r="3" fill={agentChar.eyeColor} />
                      <circle cx="14" cy="18" r="1" fill="#ffffff" />
                      <circle cx="24" cy="18" r="1" fill="#ffffff" />
                      <rect
                        x="13"
                        y="24"
                        width="10"
                        height="2.5"
                        rx="1.25"
                        fill={agentChar.eyeColor}
                        fillOpacity="0.85"
                      />
                    </svg>
                  </div>
                  <span
                    className={`absolute -bottom-1 -right-1 w-3.5 h-3.5 rounded-full border-2 border-slate-900 ${agentChar.pulseClass}`}
                  />
                </div>

                <div className="min-w-0 flex-1">
                  <div className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">
                    Active Sovereign Agent
                  </div>
                  <h2 className="text-base font-bold text-white truncate">{agentChar.name}</h2>
                </div>
              </div>

              {/* Integrated Architecture Elements for Active Tier (Color-coded by location) */}
              <div className="p-3 rounded-xl bg-slate-950/80 border border-slate-800/90 space-y-2 text-[11px] font-mono leading-tight">
                <div className="flex items-start justify-between gap-2 text-slate-400">
                  <span className="text-slate-500 shrink-0">⚙️ Runtime:</span>
                  <span className={`text-right font-sans ${agentChar.runtimeColor}`}>
                    {agentChar.runtime}
                  </span>
                </div>
                <div className="flex items-start justify-between gap-2 text-slate-400">
                  <span className="text-slate-500 shrink-0">⚡ Inference:</span>
                  <span className={`text-right font-sans ${agentChar.inferenceColor}`}>
                    {agentChar.inference}
                  </span>
                </div>
                <div className="flex items-start justify-between gap-2 text-slate-400">
                  <span className="text-slate-500 shrink-0">💾 Memory:</span>
                  <span className={`text-right font-sans ${agentChar.memoryColor}`}>
                    {agentChar.memory}
                  </span>
                </div>
                {controls.enablePiiTokenizer && (
                  <div className="flex items-start justify-between gap-2 text-slate-400 border-t border-slate-800/60 pt-1.5">
                    <span className="text-slate-500 shrink-0">🛡️ PII Cleanser:</span>
                    <span className={`text-right font-sans ${agentChar.piiCleanserColor}`}>
                      {agentChar.piiCleanser}
                    </span>
                  </div>
                )}
                {controls.enterpriseDataEnabled && (
                  <>
                    <div className="flex items-start justify-between gap-2 text-slate-400 border-t border-slate-800/60 pt-1.5">
                      <span className="text-slate-500 shrink-0">🧠 Skill:</span>
                      <span className={`text-right font-sans ${agentChar.skillColor}`}>
                        {agentChar.skill}
                      </span>
                    </div>
                    <div className="flex items-start justify-between gap-2 text-slate-400">
                      <span className="text-slate-500 shrink-0">🔧 Tool:</span>
                      <span className={`text-right font-sans ${agentChar.toolColor}`}>
                        {agentChar.tool}
                      </span>
                    </div>
                    <div className="flex items-start justify-between gap-2 text-slate-400">
                      <span className="text-slate-500 shrink-0">📁 Storage (Rest):</span>
                      <span className={`text-right font-sans ${agentChar.storageRestColor}`}>
                        {agentChar.storageRest}
                      </span>
                    </div>
                  </>
                )}
              </div>
            </div>

            {/* 1. Manual Tier Override & Fail Checkboxes */}
            <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
              <div className="flex items-center justify-between">
                <h3 className="text-xs font-semibold text-slate-200 uppercase tracking-wide">
                  Manual Sovereignty Override
                </h3>
                <span className="text-[10px] text-slate-500 font-mono">Inject Fault</span>
              </div>
              <div className="space-y-2">
                {[
                  { id: 'AUTO', label: 'Auto Cascade (Default)', desc: 'Tier 1 -> Tier 2 -> Tier 3' },
                  { id: 'TIER_1_GLOBAL', label: 'Lock Tier 1 (Global)', desc: 'Generative AI Global API' },
                  { id: 'TIER_2_REGIONAL', label: 'Lock Tier 2 (AU-SYD)', desc: 'Vertex AI Sydney Data Residency' },
                  { id: 'TIER_3_SOVEREIGN', label: 'Lock Tier 3 (Airgap VPC)', desc: 'Private VPC Gemma-2 Open Weights' },
                ].map((opt) => (
                  <div
                    key={opt.id}
                    onClick={() => handleForcedTierChange(opt.id)}
                    className={`flex items-center justify-between p-2.5 rounded-lg border cursor-pointer transition ${

    function ChatWindow({ messages, isLoading, onSendMessage, enablePiiTokenizer = true, enterpriseDataEnabled = false }) {

        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

        scrollToBottom();
      }, [messages, isLoading, effectiveTab]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!input.trim() || isLoading) return;
        onSendMessage(input);
        setInput('');

      const toggleLog = (id) => {
        setExpandedLogs((prev) => ({ ...prev, [id]: !prev[id] }));
      };

      const highlightTokens = (text) => {
        if (!text) return null;
        const parts = text.split(/(\[\[PII_[A-Z0-9_]+\]\])/g);
        return parts.map((part, i) => {
          if (part.startsWith('[[PII_') && part.endsWith(']]')) {
            const entType = part.replace(/^\[\[PII_/, '').split('_')[0];
            let colorClass = 'bg-purple-500/20 text-purple-300 border-purple-500/40';
            if (entType.includes('AU') || entType.includes('TFN') || entType.includes('BSB') || entType.includes('MEDICARE')) {
              colorClass = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
            } else if (entType.includes('PERSON')) {
              colorClass = 'bg-blue-500/20 text-blue-300 border-blue-500/40';
            }
            return (
              <span
                key={i}
                className={`inline-flex items-center gap-1 font-mono text-[11px] px-1.5 py-0.5 rounded border font-semibold mx-0.5 ${colorClass}`}
                title={`PII Token: ${part}`}
              >
                <span>🛡️</span>
                <span>{part}</span>
              </span>
            );

          return <span key={i}>{part}</span>;
        });

                >
                  <span>🔀</span>
                  <span>Split / Diff View</span>
                </button>
              </div>

              <div className="text-[11px] text-slate-400 font-mono hidden md:flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                <span>Parallel Context Window Synchronized</span>
              </div>
            </div>
          )}

          <div className="flex-1 overflow-y-auto p-6 space-y-6">
            {messages.length === 0 ? (
              <div className="h-full flex flex-col items-center justify-center text-center p-8 max-w-xl mx-auto space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-xl text-blue-400 mb-2 shadow-lg shadow-blue-500/10">
                  🛡️
                </div>
                <div>
                  <h2 className="text-base font-bold text-white mb-1">
                    Welcome to Project Sovereign-Stream
                  </h2>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    Test live 3-tier sovereign AI failover with Zero-PII Egress Protection. Select one of the executive sample prompts below, or type your own query.
                  </p>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-lg pt-2">
                  {[
                    { title: 'Transfer PII Query', prompt: "Transfer $500 from John Smith's account 123-456 to Jane Doe." },
                    { title: 'AU Identity Audit', prompt: "Customer Sarah Connor with TFN 123 456 782 and Medicare 2123 45670 1 requested balance audit." },
                    { title: 'APRA CPS 234 Compliance', prompt: 'How does Sovereign-Stream adhere to APRA CPS 234 requirements?' },
                    { title: 'Zero PII Egress', prompt: 'Explain the zero PII egress architecture for FSI workloads' },
                  ].map((item, idx) => (
                    <button
                      key={idx}
                      onClick={() => onSendMessage(item.prompt)}
                      className="p-3 rounded-xl bg-slate-900/80 hover:bg-slate-900 border border-slate-800/80 hover:border-blue-500/40 text-left transition group"
                    >
                      <div className="text-xs font-semibold text-white group-hover:text-blue-400 transition">
                        {item.title}
                      </div>
                      <div className="text-[10px] text-slate-400 line-clamp-1 mt-1 font-mono">
                        "{item.prompt}"
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              messages.map((msg) => {
                const tokenizedUserPrompt = msg.metadata?.tokenizedPrompt;
                const tokenizedResp = msg.metadata?.tokenizedResponse;

                let displayContent = msg.content;
                if (effectiveTab === 'shield') {
                  if (msg.role === 'user' && tokenizedUserPrompt) {
                    displayContent = tokenizedUserPrompt;
                  } else if (msg.role === 'assistant' && tokenizedResp) {
                    displayContent = tokenizedResp;
                  }
                }

                if (effectiveTab === 'diff') {
                  return (
                    <div key={msg.id} className="w-full space-y-2">
                      <div className="text-[10px] font-mono uppercase tracking-wider text-slate-400 flex items-center justify-between">
                        <span>{msg.role === 'user' ? '👤 User Turn' : '🤖 Assistant Turn'}</span>
                        <span>{msg.timestamp}</span>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div className="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs text-slate-200 space-y-1">
                          <div className="text-[10px] font-bold text-blue-400 uppercase tracking-wide">
                            💬 Canonical Cleartext (Vault View)
                          </div>
                          <div className="whitespace-pre-wrap font-sans text-sm">{msg.content}</div>
                        </div>
                        <div className="p-3.5 rounded-xl bg-purple-950/30 border border-purple-800/50 text-xs text-purple-200 space-y-1">
                          <div className="text-[10px] font-bold text-purple-400 uppercase tracking-wide">
                            🛡️ Model-Facing Context (Zero-Egress View)
                          </div>
                          <div className="whitespace-pre-wrap font-mono text-xs">
                            {highlightTokens(
                              (msg.role === 'user' ? tokenizedUserPrompt : tokenizedResp) || msg.content
                            )}
                          </div>
                        </div>
                      </div>
                      {msg.role === 'assistant' && renderCollapsibleTelemetry(msg.id, msg.metadata)}
                    </div>
                  );
                }

                return (
                  <div
                    key={msg.id}
                    className={`flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}`}
                  >
                    <div
                      className={`max-w-3xl w-full rounded-2xl p-5 ${
                        msg.role === 'user'
                          ? effectiveTab === 'shield'
                            ? 'bg-purple-900/80 border border-purple-700 text-white rounded-br-none font-mono text-xs'
                            : 'bg-blue-600 text-white rounded-br-none'
                          : 'bg-slate-900 border border-slate-800 text-slate-100 rounded-bl-none'
                      }`}
                    >
                      <div className="text-sm leading-relaxed whitespace-pre-wrap font-sans">
                        {effectiveTab === 'shield' ? highlightTokens(displayContent) : displayContent}
                      </div>
                      {msg.role === 'assistant' && renderCollapsibleTelemetry(msg.id, msg.metadata)}
                      <div className="text-[10px] text-slate-400/80 mt-2 text-right">
                        {msg.timestamp}
                      </div>
                    </div>
                  </div>
                );
              })
            )}

            {isLoading && (
              <div className="flex items-start">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-xs text-slate-400 flex items-center gap-3">
                  <div className="w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin" />
                  <span>Routing request through ADK Sovereign Cascade &amp; Shield...</span>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          <form onSubmit={handleSubmit} className="p-4 bg-slate-900 border-t border-slate-800">
            <div className="max-w-4xl mx-auto flex items-center gap-3">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                disabled={isLoading}
                placeholder="Type your sensitive query (e.g. John Smith, account 123-456, TFN 123 456 782)..."
                className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
              />
              <button
                type="submit"
                disabled={isLoading || !input.trim()}
                className="px-6 py-3 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-600 text-white text-sm font-semibold rounded-xl transition shadow-sm"
              >
                Send
              </button>
            </div>
          </form>

          {selectedLog && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xl w-full space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white">ADK Routing &amp; Failover Hop Log</h3>
                  <button
                    onClick={() => setSelectedLog(null)}
                    className="text-slate-400 hover:text-white text-lg font-bold"
                  >
                    &times;
                  </button>
                </div>
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-300 max-h-80 overflow-y-auto space-y-2">
                  <div className="text-blue-400 font-bold">// Active Execution Metadata:</div>
                  <div>Active Tier: {selectedLog.activeTier}</div>
                  <div>Routing Mode: {selectedLog.routingMode}</div>
                  <div>Latency: {selectedLog.latencyMs}ms</div>
                  <div>Wasted Latency Avoided: {selectedLog.wastedLatencyAvoidedMs}ms</div>
                  <div className="text-amber-400 font-bold pt-2">// Attempted Hop Sequence:</div>
                  <pre className="text-slate-300">{JSON.stringify(selectedLog.failoverLog, null, 2)}</pre>
                </div>
                <div className="flex justify-end">
                  <button
                    onClick={() => setSelectedLog(null)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg text-white"
                  >
                    Close Modal
                  </button>
                </div>
              </div>
            </div>
          )}
        </main>
      );
    }

    function App() {
      const [sessionId, setSessionId] = useState(() => {
        const stored = localStorage.getItem('sovereign_session_id');
        if (stored) return stored;
        const newId = `session-${Date.now()}`;
        localStorage.setItem('sovereign_session_id', newId);
        return newId;
      });
      const [messages, setMessages] = useState([]);
      const [metadataHistory, setMetadataHistory] = useState([]);
      const [buildInfo, setBuildInfo] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [catalog, setCatalog] = useState([]);
      const [tierSettings, setTierSettings] = useState({
        TIER_1_GLOBAL: { region: 'global', model: 'gemini-3.7-flash' },
        TIER_2_REGIONAL: { region: 'australia-southeast1', model: 'gemini-2.5-flash' },
        TIER_3_SOVEREIGN: { region: 'airgap-vpc-ausyd', model: 'google/gemma-2-9b-it' },
      });
      const [controls, setControls] = useState({
        failedTiers: [],
        forcedTier: 'AUTO',
        enablePiiTokenizer: true,
        tierSettings: {
          TIER_1_GLOBAL: { region: 'global', model: 'gemini-3.7-flash' },
          TIER_2_REGIONAL: { region: 'australia-southeast1', model: 'gemini-2.5-flash' },
          TIER_3_SOVEREIGN: { region: 'airgap-vpc-ausyd', model: 'google/gemma-2-9b-it' },
        },
      });

      useEffect(() => {
        // Load synchronized session history if available
        fetch(`/api/session/${sessionId}`)
          .then((res) => res.json())
          .then((data) => {
            if (data && data.messages && data.messages.length > 0) {
              const loadedMsgs = data.messages.map((m, idx) => ({
                id: `msg-${idx}-${m.role}`,
                role: m.role === 'model' || m.role === 'assistant' ? 'assistant' : 'user',
                content: m.content,
                timestamp: '',
              }));
              setMessages(loadedMsgs);
            }
          })
          .catch((err) => console.error('Failed to load session history:', err));

        fetch('/api/models')
          .then((res) => res.json())
          .then((data) => {
            if (data.catalog) setCatalog(data.catalog);
            if (data.activeTierSettings) {
              setTierSettings(data.activeTierSettings);
              setControls((prev) => ({ ...prev, tierSettings: data.activeTierSettings }));
            }
            if (data.buildInfo) {
              setBuildInfo(data.buildInfo);
            } else {
              fetch('/api/build-info')
                .then((r) => r.json())
                .then((info) => setBuildInfo(info))
                .catch(() => {});
            }
          })
          .catch((err) => console.error('Failed to load regional models catalog:', err));
      }, [sessionId]);

      const handleSaveSettings = async (updatedSettings) => {
        setTierSettings(updatedSettings);
        setControls((prev) => ({ ...prev, tierSettings: updatedSettings }));

        try {
          await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tierSettings: updatedSettings }),
          });
        } catch (err) {
          console.error('Failed to sync tier settings to backend:', err);
        }
      };

      const lastMetadata = metadataHistory[metadataHistory.length - 1];

      const handleSendMessage = async (text) => {
        const userMsgId = `msg-${Date.now()}-user`;
        const userMsg = {
          id: userMsgId,
          role: 'user',
          content: text,
          timestamp: new Date().toLocaleTimeString(),
        };

        setMessages((prev) => [...prev, userMsg]);
        setIsLoading(true);

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId,
              message: text,
              simulationControls: {
                ...controls,
                tierSettings: tierSettings,
              },
            }),
          });

          if (!response.ok) {
            let errorDetail = `Gateway returned HTTP ${response.status}`;
            try {
              const errData = await response.json();
              if (errData && errData.detail) {
                errorDetail = errData.detail;
              }
            } catch (_) {}
            throw new Error(errorDetail);
          }

          const data = await response.json();
          const meta = data.executionMetadata;

          // Update user message with tokenized prompt metadata
          if (meta && meta.tokenizedPrompt) {
            setMessages((prev) =>
              prev.map((m) =>
                m.id === userMsgId ? { ...m, metadata: { ...m.metadata, tokenizedPrompt: meta.tokenizedPrompt } } : m
              )
            );
          }

          const assistantMsg = {
            id: `msg-${Date.now()}-assistant`,
            role: 'assistant',
            content: data.content,
            timestamp: new Date().toLocaleTimeString(),
            metadata: meta,
          };

          setMessages((prev) => [...prev, assistantMsg]);
          setMetadataHistory((prev) => [...prev, meta]);
        } catch (err) {
          const errorMsg = {
            id: `msg-${Date.now()}-error`,
            role: 'assistant',
            content: `[ADK Gateway Communication Error] Failed to complete chat turn: ${err.message}`,
            timestamp: new Date().toLocaleTimeString(),
          };
          setMessages((prev) => [...prev, errorMsg]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleResetChat = () => {
        setMessages([]);
        setMetadataHistory([]);
        const newId = `session-${Date.now()}`;
        localStorage.setItem('sovereign_session_id', newId);
        setSessionId(newId);
      };

      return (
        <div className="h-screen overflow-hidden flex flex-col bg-slate-950 font-sans text-slate-100">
          <TelemetryHeader
            lastMetadata={lastMetadata}
            buildInfo={buildInfo}
            onOpenSettings={() => setIsSettingsOpen(true)}
            onResetChat={handleResetChat}
          />
          <div className="flex flex-1 min-h-0 overflow-hidden">
            <ChaosPanel
              controls={controls}
              onChange={(newControls) => setControls({ ...newControls, tierSettings })}
              metadataList={metadataHistory}
              onResetChat={handleResetChat}
            />
            <ChatWindow
              messages={messages}
              isLoading={isLoading}
              onSendMessage={handleSendMessage}
              enablePiiTokenizer={controls.enablePiiTokenizer}
            />
          </div>

          <SettingsModal
            isOpen={isSettingsOpen}
            onClose={() => setIsSettingsOpen(false)}
            catalog={catalog}
            tierSettings={tierSettings}
            onSaveSettings={handleSaveSettings}
            controls={controls}
            onUpdateControls={(newControls) => setControls(newControls)}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
